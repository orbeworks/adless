name: Deploy Adless DNS Worker Development

on:
  push:
    branches:
      - develop
    paths:
      - "apps/dns-worker/**"
      - "tools/blocklists/**"
      - "tools/dns-worker/**"
      - ".github/workflows/deploy-dns-worker-development.yml"
  workflow_dispatch:

concurrency:
  group: adless-dns-worker-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test and prepare the development Worker
        run: |
          npm run test:dns-worker
          python3 tools/dns-worker/prepare_blocklist.py
          python3 tools/blocklists/validate_blocklist.py
          npm run build:dns-worker

      - name: Publish isolated development Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing" >&2; exit 1; }
          npx --yes wrangler@4 deploy --env development \
            --config apps/dns-worker/wrangler.toml

      - name: Verify development health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "https://adless-dns-development.orbeworks.workers.dev/healthz" \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert data == {"status": "ok", "environment": "development"}, data'
