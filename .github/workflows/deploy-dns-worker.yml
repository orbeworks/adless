name: Deploy Adless DNS Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/dns-worker/**"
      - "tools/blocklists/**"
      - "tools/dns-worker/**"
      - ".github/workflows/deploy-dns-worker.yml"
  workflow_dispatch:

concurrency:
  group: adless-dns-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare and validate the edge blocklist
        run: |
          python3 tools/dns-worker/prepare_blocklist.py
          python3 tools/blocklists/validate_blocklist.py
          npm run build:dns-worker

      - name: Preserve the published TestFlight build allowlist
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing" >&2; exit 1; }
          python3 tools/dns-worker/testflight_builds.py merge-for-deploy \
            --config apps/dns-worker/wrangler.toml

      - name: Publish Worker preserving authorized TestFlight builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESTFLIGHT_BUILDS: ${{ steps.deploy.outputs.builds }}
        run: |
          set -euo pipefail
          test -n "$TESTFLIGHT_BUILDS"
          npx --yes wrangler@4 deploy --env="" --config apps/dns-worker/wrangler.toml \
            --var "APPLE_TESTFLIGHT_BUILD_VERSIONS:$TESTFLIGHT_BUILDS"
          python3 tools/dns-worker/testflight_builds.py verify --builds "$TESTFLIGHT_BUILDS"

      - name: Verify production health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            "https://adless-dns.orbeworks.workers.dev/healthz" \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); assert data == {"status": "ok", "environment": "production"}, data'
